<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>crowd-flow replay</title>
  <style>
    :root {
      --bg: #070b14;
      --card: #101827;
      --line: #1f2a3d;
      --text: #e8eefc;
      --muted: #8b9bb8;
      --accent: #5eead4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.3 ui-sans-serif, system-ui, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      background: radial-gradient(1200px 600px at 20% -10%, #12203a 0%, transparent 55%), var(--bg);
    }

    header {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      overflow: hidden;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: .04em;
    }

    h1 span {
      color: var(--accent);
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    button,
    .chip {
      background: #182338;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      border-color: var(--accent);
    }

    .chip {
      color: var(--muted);
      cursor: default;
    }

    main {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: grid;
      gap: 8px;
      padding: 8px 12px 10px;
      grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows, 1), minmax(0, 1fr));
    }

    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px 4px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .hud b {
      font-weight: 650;
    }

    .hud small {
      color: var(--muted);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 4px;
      padding: 0 10px 6px;
      flex-shrink: 0;
    }

    .metrics div {
      background: #0b1220;
      border-radius: 6px;
      padding: 3px 6px;
    }

    .metrics span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .metrics strong {
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    input[type=range] {
      width: 110px;
      accent-color: var(--accent);
    }

    input[type=number] {
      width: 4.2rem;
      background: #0b1220;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 6px;
    }

    .track {
      height: 3px;
      background: #0b1220;
      flex-shrink: 0;
    }

    .track i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
    }

    .stage {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      position: relative;
    }

    canvas {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: block;
      background: #0b1220;
    }

    kbd {
      font: 11px ui-monospace, monospace;
      color: var(--muted);
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <header>
    <h1>crowd-flow <span>replay</span></h1>
    <kbd>space pause · r restart · [ slower · ] faster</kbd>
    <div class="bar">
      <button id="play" type="button">Pause</button>
      <button id="restart" type="button">Restart</button>
      <label class="chip">speed <input id="rate" type="range" min="0.01" max="8" step="0.01" value="1" />
        <input id="raten" type="number" min="0.01" max="8" step="0.01" value="1" />×</label>
      <span class="chip" id="scale"></span>
      <span class="chip" id="elapsed"></span>
    </div>
  </header>
  <main id="grid"></main>
  <script>
    const DATA = __DATA__;
    const WORLD = DATA.world_size, HALF = DATA.world_half, AGENT_R = DATA.agent_radius;
    const RATE_MIN = 0.01, RATE_MAX = 8;
    const GOALS = ["#7dd3fc", "#86efac", "#fde047", "#fdba74", "#f9a8d4", "#c4b5fd", "#67e8f9", "#fca5a5"];
    const OBS = DATA.obstacles || [];
    const XY_SCALE = 32767 / HALF;

    function b64bytes(s) {
      const bin = atob(s);
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return u8;
    }
    function b64i16(s) {
      const u8 = b64bytes(s);
      return new Int16Array(u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength));
    }

    const tracks = DATA.tracks.map((t) => {
      const cum = [0];
      let acc = 0;
      for (let i = 1; i < t.step_ms.length; i++) { acc += t.step_ms[i]; cum.push(acc); }
      return { ...t, cum, xy: b64i16(t.xy), goal: b64bytes(t.goal) };
    });
    const span = Math.max(0, ...tracks.map((t) => t.total_ms));
    const fit = DATA.fit || 0;
    const scale = (fit > 0 && span > 0) ? (fit * 1000) / span : 1;

    const grid = document.getElementById("grid");
    const cols = tracks.length > 1 ? 2 : 1;
    const rows = Math.ceil(tracks.length / cols);
    grid.style.setProperty("--cols", cols);
    grid.style.setProperty("--rows", rows);
    const panes = tracks.map((t) => {
      const art = document.createElement("article");
      art.innerHTML = `<div class="hud"><b></b><small></small></div>
        <div class="metrics"></div>
        <div class="track"><i></i></div>
        <div class="stage"><canvas></canvas></div>`;
      grid.appendChild(art);
      const canvas = art.querySelector("canvas");
      const ctx = canvas.getContext("2d");
      return {
        t, art, canvas, ctx,
        title: art.querySelector("b"),
        meta: art.querySelector("small"),
        metrics: art.querySelector(".metrics"),
        bar: art.querySelector("i"),
      };
    });

    let paused = false, rate = 1, origin = performance.now(), hold = 0;

    function rawWallMs() {
      if (paused) return hold;
      return (performance.now() - origin) * rate * scale;
    }
    function wallMs() {
      return span > 0 ? Math.min(span, rawWallMs()) : 0;
    }
    function stopAtEnd() {
      if (paused || span <= 0 || rawWallMs() < span) return;
      hold = span;
      paused = true;
      document.getElementById("play").textContent = "Play";
    }
    function frameAt(cum, ms) {
      let lo = 0, hi = cum.length - 1, ans = 0;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (cum[mid] <= ms) { ans = mid; lo = mid + 1; } else hi = mid - 1;
      }
      return ans;
    }
    function toggle() {
      if (!paused) {
        hold = wallMs();
        paused = true;
        document.getElementById("play").textContent = "Play";
        return;
      }
      if (span > 0 && hold >= span) return;
      origin = performance.now() - hold / (rate * scale);
      paused = false;
      document.getElementById("play").textContent = "Pause";
    }
    function restart() { origin = performance.now(); hold = 0; paused = false; document.getElementById("play").textContent = "Pause"; }

    function setRate(next) {
      const now = wallMs();
      rate = Math.min(RATE_MAX, Math.max(RATE_MIN, next));
      origin = performance.now() - now / (rate * scale);
      hold = now;
      document.getElementById("rate").value = String(rate);
      document.getElementById("raten").value = String(rate);
    }
    function fps(ms) { return ms > 0 ? (1000 / ms) : 0; }
    function cell(label, value) {
      return `<div><span>${label}</span><strong>${value}</strong></div>`;
    }

    document.getElementById("play").onclick = toggle;
    document.getElementById("restart").onclick = restart;
    document.getElementById("rate").oninput = (e) => setRate(+e.target.value);
    document.getElementById("raten").onchange = (e) => setRate(+e.target.value || RATE_MIN);
    document.getElementById("scale").textContent = fit > 0 ? `fit ${fit}s  (${scale.toFixed(1)}× clock)` : "1:1 wall";
    addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); toggle(); }
      if (e.key === "r") restart();
      if (e.key === "[") setRate(rate * 0.5);
      if (e.key === "]") setRate(rate * 2);
    });

    function draw(p, f) {
      const { canvas, ctx, t } = p;
      const stage = canvas.parentElement;
      const side = Math.max(1, Math.floor(Math.min(stage.clientWidth, stage.clientHeight)));
      canvas.style.width = side + "px";
      canvas.style.height = side + "px";
      const dpr = devicePixelRatio || 1;
      const w = side, h = side;
      if (canvas.width !== (w * dpr | 0) || canvas.height !== (h * dpr | 0)) {
        canvas.width = w * dpr; canvas.height = h * dpr;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#152038";
      ctx.strokeStyle = "#3d5a80";
      ctx.lineWidth = 1.5;
      for (const o of OBS) {
        const px = ((o.x + HALF) / WORLD) * w;
        const py = ((HALF - o.y) / WORLD) * h;
        const rr = (o.radius / WORLD) * w;
        ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      ctx.strokeStyle = "#1f2a3d";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
      const n = t.n_agents;
      const base = f * n;
      const r = Math.max(1.6, (AGENT_R / WORLD) * w);
      for (let i = 0; i < n; i++) {
        const x = t.xy[(base + i) * 2] / XY_SCALE;
        const y = t.xy[(base + i) * 2 + 1] / XY_SCALE;
        const px = ((x + HALF) / WORLD) * w;
        const py = ((HALF - y) / WORLD) * h;
        ctx.fillStyle = GOALS[t.goal[base + i] % GOALS.length];
        ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
      }
    }

    function tick() {
      stopAtEnd();
      const ms = wallMs();
      const frames = panes.map((p) => frameAt(p.t.cum, ms));
      const lead = Math.max(0, ...frames);
      document.getElementById("elapsed").textContent = `elapsed ${ms.toFixed(0)} ms`;
      for (let i = 0; i < panes.length; i++) {
        const p = panes[i], f = frames[i], t = p.t;
        const last = t.n_steps;
        const dt = t.step_ms[f];
        const lag = lead - f;
        p.title.textContent = t.name;
        p.meta.textContent = `n_agents=${t.n_agents}  ·  total_ms=${t.total_ms.toFixed(1)}`;
        p.metrics.innerHTML = [
          cell("step", `${f}/${last}`),
          cell("step_ms", dt.toFixed(2)),
          cell("step_fps", fps(dt).toFixed(1)),
          cell("lag", lag ? `−${lag}` : "lead"),
          cell("avg_step_ms", t.avg_step_ms.toFixed(2)),
          cell("min_step_ms", t.min_step_ms.toFixed(2)),
          cell("max_step_ms", t.max_step_ms.toFixed(2)),
          cell("fps", t.fps.toFixed(2)),
          cell("speed_mean", t.speed_mean[f].toFixed(2)),
          cell("speed_max", t.speed_max[f].toFixed(2)),
          cell("done", last ? `${(100 * f / last).toFixed(0)}%` : "0%"),
        ].join("");
        p.bar.style.width = (last ? (100 * f / last) : 0) + "%";
        draw(p, f);
      }
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>

</html>
